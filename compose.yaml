services:
  backend:
    build:
      context: backend
      dockerfile: ./Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - elk

  frontend:
    build:
      context: frontend
      dockerfile: ./Dockerfile
      args:
        REACT_APP_API_URL: http://44.210.140.4:8000
    environment:
      NODE_ENV: production
      REACT_APP_DEFAULT_CUSTOMER_ID: cust-zept
    ports:
      - "80:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - elk

networks:
  elk:
    external: true
    name: elk_elk
